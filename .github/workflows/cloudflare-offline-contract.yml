name: Buffalo Cloudflare two-model budget contracts (zero API)

on:
  pull_request:
    paths:
      - 'scripts/cloudflare/**'
      - 'scripts/run-one-native-agent-case.mjs'
      - '.github/workflows/paid-agent-case.yml'
      - '.github/workflows/cloudflare-offline-contract.yml'
      - 'scripts/compare-cloudflare-runs.mjs'

permissions:
  contents: read

jobs:
  cloudflare-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model:
          - '@cf/thinkingmachines/inkling-2-small'
          - '@cf/google/gemma-4-26b-a4b-it'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JS dependencies only for offline adapter contract
        run: npm ci --ignore-scripts
      - name: Check source syntax and compare runner
        run: |
          node --check scripts/cloudflare/active-model.mjs
          node --check scripts/cloudflare/neuron-budget.mjs
          node --check scripts/cloudflare/neuron-budget-offline.mjs
          node --check scripts/cloudflare/bootstrap-neuron-guard-offline.mjs
          node --check scripts/cloudflare/bootstrap.mjs
          node --check scripts/cloudflare/completion-policy.mjs
          node --check scripts/cloudflare/completion-policy-offline.mjs
          node --check scripts/cloudflare/mock-origin-preload.mjs
          node --check scripts/cloudflare/completion-transport-mock-offline.mjs
          node --check scripts/cloudflare/other-engine-transport.mjs
          node --check scripts/cloudflare/offline-contract.mjs
          node --check scripts/run-one-native-agent-case.mjs
          node --check scripts/compare-cloudflare-runs.mjs
      - name: Test model prices, requests and conservative local neuron guard
        env:
          BUFFALO_CF_MODEL_ID: ${{ matrix.model }}
        run: node scripts/cloudflare/neuron-budget-offline.mjs
      - name: Validate Gemma thinking disabled and truncated-result grading policy (zero API)
        env:
          BUFFALO_CF_MODEL_ID: ${{ matrix.model }}
        run: node scripts/cloudflare/completion-policy-offline.mjs
      - name: Mock HTTP response handling (zero network, no API token)
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          CLOUDFLARE_API_TOKEN: 'TEST_ONLY_NEVER_VALID'
          BUFFALO_CF_MODEL_ID: ${{ matrix.model }}
          BUFFALO_CF_MAX_POSTS: '4'
          BUFFALO_CF_MAX_NEURONS: '4000'
        run: |
          for finish in length stop tool_calls http499 tool_calls_empty empty_stop bad_arguments missing_required unknown_tool; do
            BUFFALO_MOCK_FINISH="$finish" node --import ./scripts/cloudflare/mock-origin-preload.mjs --import ./scripts/cloudflare/bootstrap.mjs scripts/cloudflare/completion-transport-mock-offline.mjs
          done
      - name: Validate selected agent + engine routing OFFLINE (no credentials, no POST)
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          BUFFALO_CF_OFFLINE: '1'
          BUFFALO_CF_MODEL_ID: ${{ matrix.model }}
          BUFFALO_CF_MAX_POSTS: '4'
          BUFFALO_CF_MAX_NEURONS: '10000'
        run: node --import ./scripts/cloudflare/bootstrap.mjs scripts/cloudflare/offline-contract.mjs
      - name: Assert oversized original-engine request is blocked by neuron quota before network
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          BUFFALO_CF_OFFLINE: '1'
          BUFFALO_CF_MODEL_ID: ${{ matrix.model }}
          BUFFALO_CF_MAX_POSTS: '10'
          BUFFALO_CF_MAX_NEURONS: '200'
        run: node --import ./scripts/cloudflare/bootstrap.mjs scripts/cloudflare/bootstrap-neuron-guard-offline.mjs
