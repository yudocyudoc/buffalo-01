name: Buffalo Worker/D1/GitHub offline contracts (no API)
on:
  pull_request:
    paths:
      - 'workers/buffalo-control-plane/**'
      - 'scripts/control-plane/**'
      - 'scripts/full-integration/**'
      - 'infra/buffalo-origin/**'
      - '.dockerignore'
      - 'agent/AgentOrchestrator.js'
      - 'agent/utilities/AgentEvalRunner.js'
      - 'agent/config/*.md'
      - 'evals/categories/policyImplementation.js'
      - 'evals/utilities/simulator/PySDSimulator.js'
      - 'scripts/run-one-native-agent-case.mjs'
      - '.github/workflows/paid-agent-case.yml'
      - '.github/workflows/buffalo-full-source-proof.yml'
      - '.github/workflows/buffalo-full-prepare-handoff.yml'
      - '.github/workflows/buffalo-original-orchestrator-offline.yml'
      - 'migrations/control-plane/**'
      - '.github/workflows/buffalo-control-plane-*.yml'
      - 'docs/BUFFALO_CONTROL_PLANE_FASE_1_2026-11-21.md'
permissions:
  contents: read
jobs:
  control-plane-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and offline Node tests
        run: |
          node --check workers/buffalo-control-plane/index.mjs
          node --check workers/buffalo-control-plane/github.mjs
          node --check workers/buffalo-control-plane/store.mjs
          node --check workers/buffalo-control-plane/service.mjs
          node --check workers/buffalo-control-plane/binding-lab.mjs
          node --check workers/buffalo-control-plane/original-live-admission.mjs
          node --test workers/buffalo-control-plane/original-live-admission.test.mjs
          node --check workers/buffalo-control-plane/original-ws-bridge-lab.mjs
          node --check infra/buffalo-origin/origin-server.mjs
          node --check infra/buffalo-origin/container-controller.mjs
          node --check infra/buffalo-origin/stage3b6-preflight.mjs
          node --test infra/buffalo-origin/stage3b6-preflight.test.mjs
          node --test infra/buffalo-origin/wrangler.private-origin.test.mjs
          node --test workers/buffalo-control-plane/original-ws-bridge-lab.test.mjs
          node --check workers/buffalo-control-plane/full-handoff-lab.mjs
          node --test workers/buffalo-control-plane/full-handoff-lab.test.mjs
          node --check workers/buffalo-control-plane/real-source-proof-lab.mjs
          node --test workers/buffalo-control-plane/real-source-proof-lab.test.mjs
          node --check workers/buffalo-control-plane/source-first-get-diagnostic.mjs
          node --test workers/buffalo-control-plane/source-first-get-diagnostic.test.mjs
          node --check workers/buffalo-control-plane/source-auth-transport.mjs
          node --check workers/buffalo-control-plane/authenticated-source-proof-lab.mjs
          node --test workers/buffalo-control-plane/authenticated-source-proof-lab.test.mjs
          node --check scripts/control-plane/offline-echo.mjs
          node --check scripts/full-integration/original-gate.mjs
          node --check scripts/full-integration/offline-egress-guard.mjs
          node --check scripts/full-integration/original-offline-orchestrator.mjs
          node --check scripts/full-integration/original-ws-handshake-gate.mjs
          node --test scripts/full-integration/original-ws-handshake-gate.test.mjs
          node scripts/full-integration/original-gate.mjs --check
          node --test scripts/full-integration/original-gate.test.mjs
          node --check scripts/full-integration/handoff-contract.mjs
          node --check scripts/full-integration/prepare-handoff.mjs
          node --check workers/buffalo-control-plane/full-handoff-store.mjs
          node --check workers/buffalo-control-plane/full-provenance-github.mjs
          node --check workers/buffalo-control-plane/full-source-attestation-store.mjs
          node --check workers/buffalo-control-plane/full-source-attestation-service.mjs
          node --check scripts/full-integration/source-proof-contract.mjs
          node --check scripts/full-integration/create-source-proof.mjs
          node --test scripts/full-integration/source-proof-dispatch-payload.test.mjs
          node --test workers/buffalo-control-plane/full-source-provenance.test.mjs
          node --test scripts/full-integration/handoff-contract.test.mjs
          node --test scripts/control-plane/contract.test.mjs workers/buffalo-control-plane/control-plane.test.mjs
      - name: Verify SQL migration and atomic state claims (SQLite only)
        run: |
          python scripts/control-plane/test-sql-offline.py
          python scripts/full-integration/test-handoff-sql.py
          python scripts/full-integration/test-source-provenance-sql.py
          python scripts/full-integration/test-live-admission-sql.py

  full-handoff-source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install metadata dependencies without invoking install hooks
        run: npm ci --ignore-scripts
      - name: Derive one real development-case manifest per original agent (no inference)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          for agent in merlin socrates themis athena_SFD; do
            node scripts/full-integration/prepare-handoff.mjs \
              --handoff-id "123e4567-e89b-42d3-a456-426614174111" \
              --agent "$agent" --case-index 0 --commit "$SOURCE_COMMIT" \
              > "$RUNNER_TEMP/full-handoff-$agent.json"
            node -e '
              const fs=require("node:fs"),assert=require("node:assert/strict");
              const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              assert.equal(x.execution,"NOT_EXECUTED");
              assert.equal(x.provenance,"DECLARED_UNVERIFIED");
              assert.equal(x.manifest.kind,"BUFFALO_FULL_HANDOFF_V1");
              assert.match(x.manifest.initial_model_sha256,/^[a-f0-9]{64}$/);
              assert.match(x.manifest_sha256,/^[a-f0-9]{64}$/);
              console.log("PASS handoff source metadata:",x.manifest.agent,x.manifest.scenario_id)
            ' "$RUNNER_TEMP/full-handoff-$agent.json"
          done
      - name: Exercise ORIGINAL Merlin SessionManager/Orchestrator in no-provider subprocess
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --test scripts/full-integration/original-offline-orchestrator.test.mjs
          node --test scripts/full-integration/original-websocket-handshake.test.mjs
          node --test scripts/full-integration/original-worker-ws-bridge.test.mjs
          node --test infra/buffalo-origin/origin-server.test.mjs
      - name: Produce and re-check a real DEV case source-proof JSON (no API)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          DIGEST="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).manifest_sha256' "$RUNNER_TEMP/full-handoff-merlin.json")"
          BUFFALO_HANDOFF_ID="123e4567-e89b-42d3-a456-426614174111" \
          BUFFALO_HANDOFF_AGENT="merlin" \
          BUFFALO_HANDOFF_CASE_INDEX="0" \
          BUFFALO_HANDOFF_MANIFEST_SHA256="$DIGEST" \
          BUFFALO_SOURCE_PROOF_PATH="$RUNNER_TEMP/source-proof-ci.json" \
          GITHUB_SHA="$SOURCE_COMMIT" \
            node scripts/full-integration/create-source-proof.mjs
          node -e '
            const fs=require("node:fs"),assert=require("node:assert/strict");
            const proof=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            assert.equal(proof.schema,"BUFFALO_FULL_SOURCE_PROOF_V1");
            assert.equal(proof.manifest_sha256,process.argv[2]);
            assert.equal(proof.commit,process.env.SOURCE_COMMIT);
            assert.equal(proof.evidence.kind,"GITHUB_SOURCE_METADATA_ONLY");
            console.log("PASS source proof from original DEV case; no model calls");
          ' "$RUNNER_TEMP/source-proof-ci.json" "$DIGEST"
      - name: Capture one original Merlin session/router offline receipt (no AI)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          HANDOFF_ID="$(node -p "require('node:crypto').randomUUID()")"
          node --import ./scripts/full-integration/offline-egress-guard.mjs \
            scripts/full-integration/original-offline-orchestrator.mjs \
            --agent merlin --case-index 0 --commit "$SOURCE_COMMIT" \
            --handoff-id "$HANDOFF_ID" > "$RUNNER_TEMP/stage3-original-stdout.txt"
          node --input-type=module - "$RUNNER_TEMP/stage3-original-stdout.txt" "$RUNNER_TEMP/stage3-original-evidence.json" <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const rows=readFileSync(process.argv[2],'utf8').split('\n')
            .filter(x=>x.startsWith('BUFFALO_ORIGINAL_OFFLINE_EVIDENCE='));
          assert.equal(rows.length,1);
          const evidence=JSON.parse(rows[0].slice('BUFFALO_ORIGINAL_OFFLINE_EVIDENCE='.length));
          assert.equal(evidence.schema,'BUFFALO_ORIGINAL_ORCHESTRATOR_OFFLINE_PREP_V1');
          assert.equal(evidence.status,'OFFLINE_BOUNDARY_PASS_NO_AGENT_OUTPUT');
          assert.equal(evidence.commit_sha,process.env.SOURCE_COMMIT);
          assert.equal(evidence.original_tool_model_sync_responses,2);
          assert.equal(evidence.terminal_error_code,'CONVERSATION_ERROR');
          assert.equal(evidence.network_attempts,0);
          assert.equal(evidence.provider_requests,0);
          assert.equal(evidence.agent_turn_executed,false);
          assert.equal(evidence.output_model_generated,false);
          assert.equal(evidence.execution_allowed,false);
          assert.equal(evidence.github_provenance_attested,false);
          writeFileSync(process.argv[3],JSON.stringify(evidence,null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify({
            schema:evidence.schema,status:evidence.status,agent:evidence.agent,
            scenario_id:evidence.scenario_id,commit:evidence.commit_sha,
            manifest_sha256:evidence.manifest_sha256,
            network_attempts:0,agent_turn_executed:false
          }));
          NODE
      - name: Upload one offline original orchestration boundary record
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-stage3-original-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/stage3-original-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
