name: Buffalo private-origin registry publish (no deploy, no AI)

on:
  pull_request:
    paths:
      - '.github/workflows/buffalo-private-origin-registry-publish.yml'
      - '.github/workflows/buffalo-stage3b6-handoff-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffalo-private-origin-registry-publish.yml'
      - '.github/workflows/buffalo-stage3b6-handoff-bootstrap.yml'

permissions:
  contents: read

jobs:
  registry-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: e0cb52526a69c0f48f001901a5b9a640
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source identity and prohibit PR-side push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          docker buildx version
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "PR_BUILD_ONLY_NO_REGISTRY_PUSH"
          fi
      - name: Check credentials for main-only publish (never print values)
        if: github.event_name == 'push'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_CONTAINERS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::REGISTRY_PUBLISH_BLOCKED_MISSING_BUFFALO_CF_CONTAINERS_TOKEN"
            exit 1
          }
      - name: Resolve immutable base and build image locally
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 node:22-bookworm-slim
          BASE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-bookworm-slim)"
          case "$BASE_REF" in node@sha256:*) ;; *) echo "BASE_DIGEST_MISSING"; exit 1 ;; esac
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 \
            --provenance=false --sbom=false \
            --build-arg "NODE_BASE_IMAGE=$BASE_REF" \
            --build-arg "BUFFALO_IMAGE_SOURCE_SHA=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/yudocyudoc/buffalo-01" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.base.name=$BASE_REF" \
            --metadata-file "$RUNNER_TEMP/buffalo-registry-build.json" \
            --tag "buffalo-private-origin:$GITHUB_SHA" --load \
            -f infra/buffalo-origin/Dockerfile .
      - name: Exercise original Node server inside lite memory envelope
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --memory 256m --memory-swap 256m --pids-limit 64 \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            "buffalo-private-origin:$GITHUB_SHA" \
            node --test infra/buffalo-origin/origin-server.test.mjs | tee "$RUNNER_TEMP/buffalo-node-test.log"
          grep -Fx '# tests 4' "$RUNNER_TEMP/buffalo-node-test.log"
          grep -Fx '# pass 4' "$RUNNER_TEMP/buffalo-node-test.log"
          grep -Fx '# fail 0' "$RUNNER_TEMP/buffalo-node-test.log"
          docker run --rm --network none --read-only \
            --memory 256m --memory-swap 256m --pids-limit 64 \
            "buffalo-private-origin:$GITHUB_SHA" \
            sh -ec 'test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/.github && test ! -e /app/docs'
      - name: Produce local OCI receipt from the exact tested image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "buffalo-private-origin:$GITHUB_SHA" > "$RUNNER_TEMP/buffalo-local-image-inspect.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const temp=process.env.RUNNER_TEMP;
          const sha=process.env.GITHUB_SHA;
          const metadata=JSON.parse(readFileSync(temp+'/buffalo-registry-build.json','utf8'));
          const image=JSON.parse(readFileSync(temp+'/buffalo-local-image-inspect.json','utf8'))[0];
          const output=readFileSync(temp+'/buffalo-node-test.log','utf8');
          const manifest=metadata['containerimage.digest']??metadata['containerimage.descriptor']?.digest;
          assert.match(manifest??'',/^sha256:[a-f0-9]{64}$/);
          assert.match(image.Id??'',/^sha256:[a-f0-9]{64}$/);
          assert.equal(image.Config?.User,'node');
          assert.equal(image.Config?.Labels?.['org.opencontainers.image.revision'],sha);
          assert.equal(image.Config?.Env?.find(x=>x.startsWith('BUFFALO_IMAGE_SOURCE_SHA=')),
            'BUFFALO_IMAGE_SOURCE_SHA='+sha);
          for(const line of ['# tests 4','# pass 4','# fail 0'])
            assert.ok(output.split(/\\r?\\n/).includes(line),line);
          const fileHash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const receipt={
            schema:'BUFFALO_PRIVATE_ORIGIN_BUILD_RECEIPT_V1',
            status:'CI_BUILD_TESTED_NO_DEPLOY',
            source_commit:sha,
            github_run_id:Number(process.env.GITHUB_RUN_ID),
            github_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            node_tests_passed:4,
            image_manifest_digest:manifest,
            image_config_digest:image.Id,
            dockerfile_sha256:fileHash('infra/buffalo-origin/Dockerfile'),
            dockerignore_sha256:fileHash('.dockerignore'),
            security_mode:'HANDSHAKE_ONLY_NO_AGENT_PROCESS',
            published_to_registry:false,
            cloudflare_container_deployed:false,
            agent_turns:0,provider_requests:0,
            proof_scope:'CI_LOCAL_TESTED_IMAGE_NOT_CLOUDFLARE_REGISTRY'
          };
          writeFileSync(temp+'/buffalo-local-build-receipt.json',
            JSON.stringify(receipt,null,2)+'\\n',{flag:'wx'});
          console.log('LOCAL_IMAGE_TESTED_RECEIPT_CREATED_NOT_DEPLOYED');
          NODE
      - name: Publish exact built image to private Cloudflare registry, main only
        if: github.event_name == 'push'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_CONTAINERS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          npx --yes wrangler@latest containers push "buffalo-private-origin:$GITHUB_SHA"
          echo "REGISTRY_REF=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/buffalo-private-origin:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Independently pull published image and compare digests
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$REGISTRY_REF"
          docker image inspect "$REGISTRY_REF" > "$RUNNER_TEMP/buffalo-registry-inspect.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const local=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/buffalo-registry-build.json','utf8'));
          const remote=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/buffalo-registry-inspect.json','utf8'))[0];
          const source=process.env.GITHUB_SHA;
          const built=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/buffalo-local-build-receipt.json','utf8'));
          assert.equal(built.source_commit,source);
          assert.equal(built.github_run_id,Number(process.env.GITHUB_RUN_ID));
          assert.equal(built.github_run_attempt,Number(process.env.GITHUB_RUN_ATTEMPT));
          assert.equal(built.node_tests_passed,4);
          const expected=local['containerimage.digest']??local['containerimage.descriptor']?.digest;
          const refs=(remote.RepoDigests??[]).filter(x=>
            x.startsWith('registry.cloudflare.com/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/buffalo-private-origin@'));
          assert.equal(refs.length,1,'REGISTRY_DIGEST_MUST_BE_UNIQUE');
          const got=refs[0].split('@')[1];
          assert.match(expected??'',/^sha256:[a-f0-9]{64}$/);
          assert.equal(got,expected,'REGISTRY_MANIFEST_DIFFERS_FROM_CI_BUILD');
          assert.equal(built.image_manifest_digest,got);
          assert.equal(built.image_config_digest,remote.Id);
          assert.equal(remote.Config?.User,'node');
          assert.equal(remote.Config?.Labels?.['org.opencontainers.image.revision'],source);
          assert.equal(remote.Config?.Env?.find(x=>x.startsWith('BUFFALO_IMAGE_SOURCE_SHA=')),
            'BUFFALO_IMAGE_SOURCE_SHA='+source);
          if(local['containerimage.config.digest'])
            assert.equal(remote.Id,local['containerimage.config.digest']);
          const receipt={
            schema:'BUFFALO_ORIGIN_PRIVATE_REGISTRY_RELEASE_V1',
            state:'REGISTRY_IMAGE_PULLED_AND_VERIFIED_NO_DEPLOY',
            source_commit:source,
            github_run_id:Number(process.env.GITHUB_RUN_ID),
            github_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            base_image:process.env.BASE_REF,
            local_manifest_digest:expected,
            remote_manifest_digest:got,
            remote_image_config_digest:remote.Id,
            remote_ref:refs[0],
            agent_turns:0,
            cloudflare_container_started:false,
            signature_proof:false
          };
          writeFileSync(process.env.RUNNER_TEMP+'/buffalo-registry-release-receipt.json',
            JSON.stringify(receipt,null,2)+'\n',{flag:'wx'});
          console.log('REGISTRY_IMAGE_VERIFIED_NO_DEPLOY',refs[0]);
          NODE
      - name: Save published-image identity receipt (no image or secrets)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-origin-registry-identity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buffalo-local-build-receipt.json
            ${{ runner.temp }}/buffalo-registry-release-receipt.json
          if-no-files-found: error
          retention-days: 7
