name: Buffalo original agent via Cloudflare Workers AI (paid; manual only)

on:
  workflow_dispatch:
    inputs:
      consent:
        description: "Authorize Workers AI inference. The max_posts input controls the hard request cap; charges may apply."
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "I_ACCEPT_CLOUDFLARE_AI_COSTS"
      model:
        description: "Workers AI model for BOTH original agent and engine tools"
        required: true
        default: "@cf/thinkingmachines/inkling-2-small"
        type: choice
        options:
          - "@cf/thinkingmachines/inkling-2-small"
          - "@cf/google/gemma-4-26b-a4b-it"
      max_neurons:
        description: "Local estimated neuron allowance (NOT an account-wide or hard billing cap)"
        required: true
        default: "4000"
        type: choice
        options:
          - "2000"
          - "4000"
          - "6000"
      max_posts:
        description: "MAXIMUM Workers AI inference POSTs (not a dollar limit; choose consciously)"
        required: true
        default: "8"
        type: choice
        options:
          - "8"
          - "16"
          - "24"
      agent:
        description: "Original Buffalo agent"
        required: true
        default: merlin
        type: choice
        options:
          - merlin
          - themis
          - socrates
          - athena_SFD
      case_index:
        description: "Index for ONE policyImplementation development case"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: buffalo-cloudflare-native-agent-paid
  cancel-in-progress: false

jobs:
  native-agent-cloudflare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.consent == 'I_ACCEPT_CLOUDFLARE_AI_COSTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout original Buffalo fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use Python 3.11 for original PySD evaluation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify Cloudflare credentials (no inference)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in this repository."
            exit 1
          fi
      - name: Install complete original project
        run: npm ci
      - name: Install original PySD requirements
        run: python -m pip install -r third-party/PySD-simulator/requirements.txt
      - name: Validate migrated IGC adapter + runner syntax (no inference)
        run: |
          node --check scripts/cloudflare/active-model.mjs
          node --check scripts/cloudflare/neuron-budget.mjs
          node --check scripts/cloudflare/neuron-budget-offline.mjs
          node --check scripts/cloudflare/bootstrap.mjs
          node --check scripts/cloudflare/other-engine-transport.mjs
          node --check scripts/run-one-native-agent-case.mjs
          node --check scripts/cloudflare/offline-contract.mjs
      - name: Execute ONE original agent/policy case via Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUFFALO_PAID_RUN: I_ACCEPT_CLOUDFLARE_AI_COSTS
          BUFFALO_CF_MODEL_ID: ${{ inputs.model }}
          BUFFALO_CF_MAX_NEURONS: ${{ inputs.max_neurons }}
          BUFFALO_CF_MAX_POSTS: ${{ inputs.max_posts }}
          BUFFALO_AGENT: ${{ inputs.agent }}
          BUFFALO_CASE_INDEX: ${{ inputs.case_index }}
        run: node --import ./scripts/cloudflare/bootstrap.mjs scripts/run-one-native-agent-case.mjs
      - name: Save output evidence after manual public-repo review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-cloudflare-agent-policy-evidence
          path: benchmark-runs/buffalo-agent-*.json
          if-no-files-found: warn
          retention-days: 7
