name: C1-Parity.4c2b1 Frozen evidence semantic capture (offline)
on:
  push:
    branches: ['research/c1-parity-semantic-capture']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [A, B, C, D, E, F]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact accepted artifact, verify archive before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/15275418147/zip" > "$RUNNER_TEMP/accepted-families.zip"
          echo "594b25f3fc1344352cd92585527edb9cc8d3ba29d7ca3fbc463d80aad4436bd4  $RUNNER_TEMP/accepted-families.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/accepted-families.zip" c1-parity-families-false-false-false-false-false-false-false-true.json > "$RUNNER_TEMP/accepted-families.json"
          test -s "$RUNNER_TEMP/accepted-families.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --import ./research/buffalo-lab/c1/offline-guard.mjs --test infra/full-runtime/gateway.test.mjs research/buffalo-lab/c1-parity/parity.test.mjs research/buffalo-lab/c1-parity/evidence-client.test.mjs research/buffalo-lab/c1-parity/cache-bound.test.mjs research/buffalo-lab/c1-parity/cache-demand.test.mjs research/buffalo-lab/c1-parity/comparison-bound.test.mjs research/buffalo-lab/c1-parity/comparative-feedback.test.mjs research/buffalo-lab/c1-parity/intervention-reference.test.mjs research/buffalo-lab/c1-parity/intervention-families.test.mjs research/buffalo-lab/c1-parity/semantic-packets.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/full-tools" --no-audit --no-fund miniflare@5.20261119.0-beta esbuild@0.28.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv "$RUNNER_TEMP/simlin"
          "$RUNNER_TEMP/simlin/bin/python" -m pip install --only-binary=:all: pysimlin==0.8.5
          echo "BUFFALO_SIMLIN_PYTHON=$RUNNER_TEMP/simlin/bin/python" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Real WS capture on accepted frozen native evidence, no live provider
        shell: bash
        run: |
          set -euo pipefail
          export FULL_NODE="$(command -v node)" FULL_TEST_TOOLS="$RUNNER_TEMP/full-tools" FULL_PYTHON_PATH="$(dirname "$(command -v python3)")"
          export C1_PARITY_REPORT="$RUNNER_TEMP/semantic-capture-${{ matrix.case }}.json" C1_PARITY_ACCUMULATE=true C1_PARITY_STRICT_CACHE=true C1_PARITY_COMPARISON=true C1_PARITY_COMPARATIVE_FEEDBACK=true C1_PARITY_SEMANTIC_CASE="${{ matrix.case }}" C1_PARITY_ACCEPTED_SOURCE="$RUNNER_TEMP/accepted-families.json"
          sudo --preserve-env=FULL_NODE,FULL_TEST_TOOLS,FULL_PYTHON_PATH,BUFFALO_SIMLIN_PYTHON,C1_PARITY_REPORT,C1_PARITY_ACCUMULATE,C1_PARITY_STRICT_CACHE,C1_PARITY_COMPARISON,C1_PARITY_COMPARATIVE_FEEDBACK,C1_PARITY_SEMANTIC_CASE,C1_PARITY_ACCEPTED_SOURCE unshare --net --mount --propagation private sh -ec '
            ip link set lo up
            sysctl -qw net.ipv4.ip_unprivileged_port_start=0
            hosts=$(mktemp)
            cat /etc/hosts > "$hosts"
            echo "127.0.0.1 merlin-provider.internal" >> "$hosts"
            chmod 644 "$hosts"
            mount --bind "$hosts" /etc/hosts
            exec runuser -u runner -- env PATH="$FULL_PYTHON_PATH:$PATH" "$FULL_NODE" infra/full-runtime/offline.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-capture-${{ matrix.case }}
          path: ${{ runner.temp }}/semantic-capture-${{ matrix.case }}.json
          if-no-files-found: warn
          retention-days: 30
