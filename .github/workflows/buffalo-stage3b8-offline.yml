name: Buffalo Stage 3B-8/P original Merlin process offline (NO provider)
on:
  pull_request:
    paths:
      - 'scripts/full-integration/original-merlin-process-gate.mjs'
      - 'scripts/full-integration/original-merlin-process-gate.test.mjs'
      - 'scripts/full-integration/original-merlin-worker-boundary.mjs'
      - 'scripts/full-integration/original-merlin-worker-boundary.test.mjs'
      - '.github/workflows/buffalo-stage3b8-offline.yml'
permissions:
  contents: read
jobs:
  pure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure gate and denial policy tests (no npm, no provider)
        run: |
          node --check scripts/full-integration/original-merlin-process-gate.mjs
          node --check scripts/full-integration/original-merlin-worker-boundary.mjs
          node --test scripts/full-integration/original-merlin-process-gate.test.mjs
          # The next file imports the original WorkerSpawner (requires npm), so
          # its negative tests run in the isolated original-worker job below.

  original-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: pure-contract
    env:
      ALLOW_UNSANDBOXED_FALLBACK: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install sandbox binary on ephemeral Linux runner (NO live service)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      - name: Negative controls on original WorkerSpawner admission
        run: node --test scripts/full-integration/original-merlin-worker-boundary.test.mjs
      - name: Probe actual ORIGINAL Merlin AgentWorker via bwrap; unregistered provider
        shell: bash
        run: |
          set -euo pipefail
          node scripts/full-integration/original-merlin-worker-boundary.mjs \
            --commit "$GITHUB_SHA" > "$RUNNER_TEMP/buffalo-3b8-stdout.txt"
          node --input-type=module - "$RUNNER_TEMP/buffalo-3b8-stdout.txt" "$RUNNER_TEMP/buffalo-3b8-proof.json" <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const lines=readFileSync(process.argv[2],'utf8').split('\n');
          const prefix='BUFFALO_3B8_PROCESS_EVIDENCE=';
          const matches=lines.filter(x=>x.startsWith(prefix));
          assert.equal(matches.length,1,'one actual process receipt required');
          const r=JSON.parse(matches[0].slice(prefix.length));
          assert.equal(r.schema,'BUFFALO_STAGE3B8_ORIGINAL_MERLIN_PROCESS_OFFLINE_V1');
          assert.equal(r.status,'ORIGINAL_MERLIN_WORKER_OFFLINE_PROVIDER_DENIED_PASS');
          assert.equal(r.checkout_commit,process.env.GITHUB_SHA);
          assert.equal(r.bwrap_ipc_worker,true);
          assert.equal(r.original_agent_worker,true);
          assert.equal(r.worker_exited,true);
          assert.equal(r.genuine_terminal_error,'CONVERSATION_ERROR');
          assert.equal(r.terminal_status,'awaiting_user');
          assert.equal(r.provider_requests_measured,false);
          assert.equal(r.agent_model_response,false);
          assert.equal(r.model_modified,false);
          assert.equal(r.bridge_or_container_deployed,false);
          assert.equal(r.execution_allowed,false);
          writeFileSync(process.argv[3],JSON.stringify(r,null,2)+'\n',{flag:'wx',mode:0o600});
          console.log('PASS ORIGINAL AGENTWORKER SANDBOXED OFFLINE, NO INFERENCE; NOT A BRIDGE RUN');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: buffalo-stage3b8-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/buffalo-3b8-proof.json
          retention-days: 7
          if-no-files-found: error
