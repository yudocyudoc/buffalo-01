name: Buffalo Full original application offline
on:
  pull_request:
    paths:
      - 'infra/full-runtime/**'
      - '.github/workflows/buffalo-full-runtime.yml'
      - '.github/workflows/buffalo-full-edit-manual.yml'
      - '.github/workflows/buffalo-full-quantitative-manual.yml'
      - '.github/workflows/buffalo-full-qualitative-manual.yml'
      - 'app.js'
      - 'agent/**'
      - 'routes/**'
      - 'engines/**'
      - 'evals/categories/qualitativeTranslation.js'
      - 'evals/categories/conformance.js'
      - 'config.js'
      - 'package*.json'
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start the production image with Internet disabled
        shell: bash
        run: |
          set -euo pipefail
          docker build -f infra/full-runtime/Dockerfile -t buffalo-full:offline .
          docker run --detach --name full --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges -e AUTHENTICATION_KEY=ci-only buffalo-full:offline
          trap 'docker logs --tail 30 full; docker rm -f full' EXIT
          test "$(docker inspect --format '{{.Config.User}}' full)" = node
          docker exec full node infra/full-runtime/test-rest.mjs
          docker exec full node infra/full-runtime/test-simulation-image.mjs
          docker exec full node infra/full-runtime/test-smoke-receipt-fixture.mjs > "$RUNNER_TEMP/quantitative-fixture.json"
          chmod 644 "$RUNNER_TEMP/quantitative-fixture.json"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$RUNNER_TEMP/quantitative-fixture.json,target=/tmp/remote-receipt.json,readonly" \
            buffalo-full:offline node infra/full-runtime/verify-remote-quantitative.mjs /tmp/remote-receipt.json --fixture > "$RUNNER_TEMP/quantitative-fixture-result.json"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.status!=="FULL_REMOTE_QUANTITATIVE_PYSD_PASS"||x.evidence_source!=="controlled-provider-fixture") process.exit(1); console.log("FULL_QUANTITATIVE_SMOKE_VERIFIER_IMAGE_OFFLINE "+JSON.stringify(x))' "$RUNNER_TEMP/quantitative-fixture-result.json"
          docker exec full node --test infra/full-runtime/verify-remote-qualitative.test.mjs
          docker exec full node infra/full-runtime/verify-quantitative-intervention.mjs > "$RUNNER_TEMP/quantitative-intervention.json"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.status!=="FULL_QUANTITATIVE_REAL_INTERVENTION_PASS"||x.evidence_source!=="archived-remote-receipt") process.exit(1); console.log("FULL_QUANTITATIVE_REAL_INTERVENTION "+JSON.stringify(x))' "$RUNNER_TEMP/quantitative-intervention.json"
      - uses: actions/upload-artifact@v4
        with:
          name: quantitative-intervention-${{ github.run_id }}
          path: ${{ runner.temp }}/quantitative-intervention.json
          retention-days: 30
          if-no-files-found: error
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test infra/full-runtime/*.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/full-tools" --no-audit --no-fund miniflare@5.20261119.0-beta esbuild@0.28.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r third-party/PySD-simulator/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Original REST, sessions and confirmed model edit with a local binding fixture
        shell: bash
        run: |
          set -euo pipefail
          export FULL_NODE="$(command -v node)" FULL_TEST_TOOLS="$RUNNER_TEMP/full-tools" FULL_PYTHON_PATH="$(dirname "$(command -v python3)")"
          sudo --preserve-env=FULL_NODE,FULL_TEST_TOOLS,FULL_PYTHON_PATH unshare --net --mount --propagation private sh -ec '
            ip link set lo up
            sysctl -qw net.ipv4.ip_unprivileged_port_start=0
            hosts=$(mktemp)
            cat /etc/hosts > "$hosts"
            echo "127.0.0.1 merlin-provider.internal" >> "$hosts"
            chmod 644 "$hosts"
            mount --bind "$hosts" /etc/hosts
            exec runuser -u runner -- env PATH="$FULL_PYTHON_PATH:$PATH" "$FULL_NODE" infra/full-runtime/offline.mjs'
