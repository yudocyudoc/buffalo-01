name: Buffalo quantitative real receipt replay (offline only)
on:
  pull_request:
    paths:
      - '.github/workflows/buffalo-full-quantitative-replay.yml'
      - 'infra/full-runtime/verify-remote-quantitative.mjs'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    # One investigation, not a permanent dependency on a short-lived artifact.
    if: ${{ github.head_ref == 'fix/quantitative-smoke-semantic-replay' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: buffalo-full-quantitative-45551954016
          repository: yudocyudoc/buffalo-01
          run-id: 45551954016
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-quantitative
      - name: Verify original receipt bytes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/original-quantitative"
          sha256sum -c <<'SHA'
          5da8e835794921082d9fa5560f3be135772d2153349c2533b45a3e2ea37b0696  remote-receipt.json
          13ad37de7af1a621217cf3e959f5eddcda4e26a719c99fefe1a2ef27f02d2170  cleanup.json
          3e58cd0a5b73d4ebf78d3ecf7e8bc71dd5b714601f0ef0b0562c48511287c4e4  registry.json
          56c470ceb26acc56038ffa22365541cc96bc2a7051f2e288ff6c76d3c4e488a6  grant.json
          SHA
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p,'utf8'));
          const r=read('remote-receipt.json'),g=read('grant.json'),reg=read('registry.json');
          assert.deepEqual(r.approval,g);
          assert.equal(g.source_commit,'381e22050e04918289ae9371fc7c17d5b1a89ee5');
          assert.equal(g.image_digest,reg.manifest_digest);
          assert.equal(r.run_id,g.run_id);assert.equal(g.max_calls,1);
          assert.equal(r.single_reservation,true);assert.equal(r.container_stopped,true);
          assert.equal(r.fixture_only,undefined);
          assert.equal(read('cleanup.json').status,'ZERO_ACTIVE_AND_DISABLED_NO_AI_OR_SECRETS');
          NODE
      - name: Replay the exact unmodified remote model using original upstream PySD
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/original-quantitative"
          docker build -f infra/full-runtime/Dockerfile -t buffalo-full:quantitative-replay .
          chmod 644 "$DIR/remote-receipt.json"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$DIR/remote-receipt.json,target=/tmp/remote-receipt.json,readonly" \
            buffalo-full:quantitative-replay node infra/full-runtime/verify-remote-quantitative.mjs /tmp/remote-receipt.json > "$DIR/replay-simulation.json"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.status!=="FULL_REMOTE_QUANTITATIVE_PYSD_PASS"||x.evidence_source!=="remote-receipt"||x.variable_count!==4) process.exit(1); console.log("FULL_QUANTITATIVE_REAL_RECEIPT_REPLAY "+JSON.stringify(x))' "$DIR/replay-simulation.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantitative-original-receipt-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/original-quantitative/*.json
          retention-days: 30
          if-no-files-found: warn
