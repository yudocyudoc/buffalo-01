name: Buffalo 3B-8/R integrated private Merlin (manual, no inference)
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact approved checkout SHA
        required: true
        type: string
      approval:
        description: Enter ONE_PRIVATE_ARENA_MERLIN_R_NO_INFERENCE
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buffalo-r1-private-one-shot
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ github.ref == 'refs/heads/main' && inputs.source_commit == github.sha && inputs.approval == 'ONE_PRIVATE_ARENA_MERLIN_R_NO_INFERENCE' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      CLOUDFLARE_ACCOUNT_ID: e0cb52526a69c0f48f001901a5b9a640
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and offline contracts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          node --test infra/private-merlin/*.test.mjs
          node infra/buffalo-origin/generate-probe-model.mjs
      - name: Verify historical R2 and unused private R before publication
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: node infra/private-merlin/manual-r.mjs preflight
      - name: Build and inspect original process image before publication
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-merlin-r"
          docker pull --platform linux/amd64 node:22-bookworm-slim
          BASE="$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-bookworm-slim)"
          case "$BASE" in node@sha256:*) ;; *) exit 1 ;; esac
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            --build-arg "NODE_BASE_IMAGE=$BASE" --build-arg "BUFFALO_IMAGE_SOURCE_SHA=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/private-merlin-r/build.json" \
            -f infra/private-merlin/Dockerfile -t "buffalo-merlin-private-origin:$GITHUB_SHA" .
          docker image inspect "buffalo-merlin-private-origin:$GITHUB_SHA" > "$RUNNER_TEMP/merlin-r-local-inspect.json"
          docker image save "buffalo-merlin-private-origin:$GITHUB_SHA" -o "$RUNNER_TEMP/merlin-r-local.tar"
          LOCAL="$(node infra/buffalo-origin/oci-config-digest.mjs "$RUNNER_TEMP/merlin-r-local.tar")"
          echo "MERLIN_LOCAL_CONFIG=$LOCAL" >> "$GITHUB_ENV"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "buffalo-merlin-private-origin:$GITHUB_SHA" sh -ec 'test -x /usr/bin/bwrap; test -f /app/agent/AgentWorker.js; test -d /app/node_modules; test ! -e /app/.env; test ! -e /app/.git'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "buffalo-merlin-private-origin:$GITHUB_SHA" /usr/bin/setpriv --inh-caps=-all --ambient-caps=-all --no-new-privs -- node infra/buffalo-r2/driver.mjs --check-context \
            | grep -Fx R2_LAUNCH_CONTEXT_VERIFIED
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            "buffalo-merlin-private-origin:$GITHUB_SHA" /usr/bin/setpriv --inh-caps=-all --ambient-caps=-all --no-new-privs -- node infra/buffalo-r2/driver.mjs --check-image | grep -Fx R2_IMAGE_IMPORTS_MODEL_CONFIG_VERIFIED
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "buffalo-merlin-private-origin:$GITHUB_SHA" > "$RUNNER_TEMP/merlin-unarmed.log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "Error: UNARMED" "$RUNNER_TEMP/merlin-unarmed.log"
      - name: Publish and independently pull exact image
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_CONTAINERS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.166.0 containers push "buffalo-merlin-private-origin:$GITHUB_SHA"
          REF="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/buffalo-merlin-private-origin:$GITHUB_SHA"
          docker pull "$REF"
          docker image inspect "$REF" > "$RUNNER_TEMP/merlin-r-remote-inspect.json"
          docker image save "$REF" -o "$RUNNER_TEMP/merlin-r-remote.tar"
          export MERLIN_REMOTE_CONFIG="$(node infra/buffalo-origin/oci-config-digest.mjs "$RUNNER_TEMP/merlin-r-remote.tar")"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync,writeFileSync} from 'node:fs';
          const e=process.env,t=e.RUNNER_TEMP;
          const build=JSON.parse(readFileSync(t+'/private-merlin-r/build.json','utf8'));
          const local=JSON.parse(readFileSync(t+'/merlin-r-local-inspect.json','utf8'))[0];
          const remote=JSON.parse(readFileSync(t+'/merlin-r-remote-inspect.json','utf8'))[0];
          const digest=build['containerimage.digest']??build['containerimage.descriptor']?.digest;
          assert.match(digest,/^sha256:[a-f0-9]{64}$/);
          const ref='registry.cloudflare.com/'+e.CLOUDFLARE_ACCOUNT_ID+'/buffalo-merlin-private-origin@'+digest;
          assert(remote.RepoDigests.includes(ref));
          assert.equal(e.MERLIN_LOCAL_CONFIG,e.MERLIN_REMOTE_CONFIG);
          assert.match(e.MERLIN_LOCAL_CONFIG,/^sha256:[a-f0-9]{64}$/);
          assert.notEqual(e.MERLIN_LOCAL_CONFIG,digest);
          for(const x of [local,remote]){
            assert.equal(x.Config.User,'node');
            assert.equal(x.Config.Labels['org.opencontainers.image.revision'],e.GITHUB_SHA);
            assert(x.Config.Env.includes('BUFFALO_IMAGE_SOURCE_SHA='+e.GITHUB_SHA));
          }
          appendFileSync(e.GITHUB_ENV,'MERLIN_REGISTRY_REF='+ref+'\n');
          writeFileSync(t+'/private-merlin-r/registry.json',JSON.stringify({source_commit:e.GITHUB_SHA,ref,config_digest:e.MERLIN_REMOTE_CONFIG,manifest_digest:digest},null,2));
          NODE
      - name: Prepare and dry-run exact configurations
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node infra/private-merlin/manual-r.mjs configs
          for kind in router bridge operator; do
            for mode in disabled armed; do
              npx --yes wrangler@4.166.0 deploy --dry-run --config "infra/private-merlin/wrangler.r-$kind-$mode.json" --outdir "$RUNNER_TEMP/r-dry-$kind-$mode"
            done
          done
      - name: Create disabled private router, bridge and operator
        id: create
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          echo 'cleanup=true' >> "$GITHUB_OUTPUT"
          for kind in router bridge operator; do
            npx --yes wrangler@4.166.0 deploy --config "infra/private-merlin/wrangler.r-$kind-disabled.json"
          done
          node infra/private-merlin/manual-r.mjs disabled-check
      - name: Arm phase R only and activate private operator cron last
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node infra/private-merlin/manual-r.mjs arm
          for kind in router bridge operator; do
            npx --yes wrangler@4.166.0 deploy --config "infra/private-merlin/wrangler.r-$kind-armed.json"
          done
      - name: Read actual D1 terminal receipt
        timeout-minutes: 27
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: node infra/private-merlin/manual-r.mjs observe
      - name: Always disarm operator
        if: ${{ always() && steps.create.outputs.cleanup == 'true' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy --config infra/private-merlin/wrangler.r-operator-disabled.json
      - name: Always disarm bridge
        if: ${{ always() && steps.create.outputs.cleanup == 'true' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy --config infra/private-merlin/wrangler.r-bridge-disabled.json
      - name: Always disarm router
        if: ${{ always() && steps.create.outputs.cleanup == 'true' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy --config infra/private-merlin/wrangler.r-router-disabled.json
      - name: Always verify independent cleanup
        if: ${{ always() && steps.create.outputs.cleanup == 'true' }}
        timeout-minutes: 18
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BUFFALO_CF_WORKERS_DEPLOY_TOKEN }}
        run: node infra/private-merlin/manual-r.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-merlin-r-manual-${{ github.run_id }}
          path: ${{ runner.temp }}/private-merlin-r/*.json
          retention-days: 7
          if-no-files-found: warn
