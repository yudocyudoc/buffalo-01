name: Buffalo Research C1 reference inventory (offline)
on:
  push:
    branches: ['research/c1-reference-inventory']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/buffalo-lab/c1/audit-reference.mjs "$RUNNER_TEMP/c1-leaderboard-inventory.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Controlled evaluator checks (no real provider)
        run: node --import ./research/buffalo-lab/c1/offline-guard.mjs --test research/buffalo-lab/c1/evaluator-controls.test.mjs
      - name: Original engine and tool routes (controlled wrapper)
        run: node --import ./research/buffalo-lab/c1/offline-guard.mjs research/buffalo-lab/c1/route-controls.mjs "$RUNNER_TEMP/c1-route-controls.json"
      - name: Original Merlin agent routes and Buffalo gateway (controlled)
        env:
          AGENT_SESSION_TEMP_DIR: ${{ runner.temp }}/c1-agent-sessions
        run: node --import ./research/buffalo-lab/c1/offline-guard.mjs research/buffalo-lab/c1/agent-route-controls.mjs "$RUNNER_TEMP/c1-agent-routes.json"
      - name: Original cache identity controls
        run: node --import ./research/buffalo-lab/c1/offline-guard.mjs research/buffalo-lab/c1/cache-controls.mjs "$RUNNER_TEMP/c1-cache-controls.json"
      - name: Prepare blinded historical review sample
        run: node --import ./research/buffalo-lab/c1/offline-guard.mjs research/buffalo-lab/c1/historical-review-pack.mjs "$RUNNER_TEMP/c1-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buffalo-c1-inventory-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/c1-leaderboard-inventory.json
            ${{ runner.temp }}/c1-route-controls.json
            ${{ runner.temp }}/c1-agent-routes.json
            ${{ runner.temp }}/c1-cache-controls.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buffalo-c1-blind-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/c1-review/blind-review.json
            ${{ runner.temp }}/c1-review/annotation-template.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buffalo-c1-review-key-KEEP-SEPARATE-${{ github.run_id }}
          path: ${{ runner.temp }}/c1-review/review-key.json
          retention-days: 30
