name: Buffalo control-plane offline echo (no AI)
run-name: Buffalo offline echo ${{ inputs.task_id }}
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: UUID issued by control plane
        required: true
        type: string
      input_sha256:
        description: Digest of offline input
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buffalo-offline-${{ inputs.task_id }}
  cancel-in-progress: false
jobs:
  offline-echo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline contract
        run: node --test scripts/control-plane/contract.test.mjs
      - name: Verify original Buffalo source (no inference, no provider calls)
        run: node scripts/full-integration/original-gate.mjs --check
      - name: Produce offline result
        env:
          BUFFALO_TASK_ID: ${{ inputs.task_id }}
          BUFFALO_INPUT_SHA256: ${{ inputs.input_sha256 }}
          BUFFALO_RESULT_PATH: ${{ runner.temp }}/buffalo-offline-result.json
        run: node scripts/control-plane/offline-echo.mjs
      - name: Upload stored ZIP for constrained verification
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-offline-${{ inputs.task_id }}
          path: ${{ runner.temp }}/buffalo-offline-result.json
          compression-level: 0
          retention-days: 7
